[project]
name = "tryorchard-sdk"
version = "0.0.1"
description = "Python client for Orchard: drive iOS and Android sandboxes over REST and live WebSocket channels."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AirOverflow" }]
keywords = ["orchard", "android", "ios", "sandbox", "emulator", "automation", "frida"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<0.29",
    "websockets>=14,<15",
    "typing_extensions>=4.7; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/tryorchard/sdk"
Documentation = "https://github.com/tryorchard/sdk/blob/main/python/docs/reference.md"
Source = "https://github.com/tryorchard/sdk/tree/main/python"
Issues = "https://github.com/tryorchard/sdk/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchard_sdk*"]

[tool.setuptools.package-data]
orchard_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
